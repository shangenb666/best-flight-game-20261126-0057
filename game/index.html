<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier — a pocket flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101c28; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Touch throttle: two round buttons at the bottom corners, only useful on
     touch screens, harmless on a desktop. They sit above the canvas so a
     drag that steers never starts on them. */
  .throttle-btn {
    position: fixed; bottom: 18px; z-index: 2;
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.55);
    background: rgba(8, 18, 30, 0.55); color: #eef4f8;
    font: 700 22px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none;
    cursor: pointer;
  }
  .throttle-btn:active { background: rgba(255, 207, 61, 0.5); }
  #throttle-up { right: 18px; }
  #throttle-down { right: 96px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Sky Courier: fly the courier jet through the rings and land on the far runway"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<button id="throttle-up" class="throttle-btn" type="button" aria-label="Throttle up">+</button>
<button id="throttle-down" class="throttle-btn" type="button" aria-label="Throttle down">−</button>
<script type="module" src="./src/main.js"></script>
</body>
</html>
